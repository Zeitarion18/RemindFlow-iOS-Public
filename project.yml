name: RemindFlow
options:
  minimumXcodeGenVersion: 2.35.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "12"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: "YES"
targets:
  RemindFlow:
    type: application
    platform: iOS
    sources:
      - path: RemindFlow
      - path: Shared
    dependencies:
      - target: RemindFlowAlarmWidget
        embed: true
    info:
      path: RemindFlow/Info.plist
      properties:
        CFBundleDisplayName: RemindFlow
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSAlarmKitUsageDescription: "RemindFlow использует системные будильники для важных напоминаний, которые ты создаёшь."
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.remindflow.personal
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: RemindFlow
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SUPPORTS_MACCATALYST: "NO"
  RemindFlowAlarmWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: RemindFlowAlarmWidget
      - path: Shared
    info:
      path: RemindFlowAlarmWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.remindflow.personal.alarmwidget
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
schemes:
  RemindFlow:
    build:
      targets:
        RemindFlow: all
    run:
      config: Debug
    archive:
      config: Release
